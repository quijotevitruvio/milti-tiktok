name: Chrome Web Store

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta de una versión pública (por ejemplo, v0.3.0)
        type: string
        required: true
      validate_only:
        description: Solo verificar el ZIP
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      PACKAGE: dist/MultiTikTok-Chrome.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verificar el paquete público
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::La etiqueta debe tener el formato vX.Y.Z."
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease +            | jq -e '.isDraft == false and .isPrerelease == false' >/dev/null
          mkdir -p dist "$RUNNER_TEMP/release-source"
          gh release download "$RELEASE_TAG" --pattern MultiTikTok-Chrome.zip --dir dist
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          git archive FETCH_HEAD extension | tar -x -C "$RUNNER_TEMP/release-source"
          python3 scripts/chrome_web_store.py "$PACKAGE" "$RELEASE_TAG" "$RUNNER_TEMP/release-source/extension"

      - name: Explicar si el envío está desactivado
        if: vars.CWS_ENABLED != 'true' || inputs.validate_only
        run: echo 'ZIP validado. El envío a Chrome Web Store está desactivado para esta ejecución.'

      - name: Autenticar con Google Cloud
        if: vars.CWS_ENABLED == 'true' && !inputs.validate_only
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
          export_environment_variables: false

      - name: Enviar versión a revisión automática
        if: vars.CWS_ENABLED == 'true' && !inputs.validate_only
        env:
          CWS_TOKEN: ${{ steps.google.outputs.access_token }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
        run: |
          python3 scripts/chrome_web_store.py "$PACKAGE" "$RELEASE_TAG" +            "$RUNNER_TEMP/release-source/extension" --submit
